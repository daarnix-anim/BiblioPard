name: Build & Release BiblioPard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension archive
        run: |
          VERSION=${GITHUB_REF_NAME:-v0.0.1}
          mkdir -p release-pkg
          cp -r CSXS dist jsx public build-scripts install.bat uninstall.bat .debug package.json README.md release-pkg/
          cd release-pkg
          zip -r "../BiblioPard-${VERSION}.zip" ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: BiblioPard-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
